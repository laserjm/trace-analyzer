[project]
name = "trace-mcp"
version = "0.1.0"
description = "MCP server exposing automotive E/E trace analysis tools to an agent"
readme = "README.md"
authors = [
    { name = "Michael Laser", email = "jmlaser@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "asammdf>=8.8.33",
    "dpkt>=1.9.8",
    "duckdb>=2.0.1",
    "lxml>=6.1.3",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "python-can>=4.6.1",
]

[project.scripts]
trace-mcp = "trace_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
